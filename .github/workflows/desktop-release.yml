name: Desktop Release

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.dsh/**'
      - 'AI_Workflow_Kit/**'
      - 'build/**'
      - 'package.json'
      - '.github/workflows/desktop-release.yml'
  workflow_dispatch:

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Intel
            runner: macos-15-intel
            arch: --x64
            artifact: pavan-workflow-macos-x64
          - name: macOS Apple Silicon
            runner: macos-15
            arch: --arm64
            artifact: pavan-workflow-macos-arm64
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Test
        run: npm test
      - name: Syntax check desktop shell
        run: npm run desktop:check
      - name: Build ad-hoc signed DMG and ZIP
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run desktop:dist:mac -- ${{ matrix.arch }}
      - name: Smoke-test packaged app outside the repository
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_APP="$(find dist -type d -name 'Pavan Workflow.app' -print -quit)"
          test -n "$SOURCE_APP"

          ISOLATED="$(mktemp -d)"
          APP="$ISOLATED/Pavan Workflow.app"
          WORKSPACE="$ISOLATED/workspace"
          LOG="$ISOLATED/harness.log"
          COOKIE="$ISOLATED/browser-cookie.txt"
          PID=''
          cleanup() {
            if [ -n "${PID:-}" ]; then kill "$PID" 2>/dev/null || true; fi
            rm -rf "$ISOLATED"
          }
          trap cleanup EXIT

          ditto "$SOURCE_APP" "$APP"
          mkdir -p "$WORKSPACE"

          BUNDLE="$APP/Contents/Resources/app"
          DSH="$BUNDLE/node_modules/@deepseek-ai/dsh/lib/bin.js"
          GROUP="$BUNDLE/node_modules/@deepseek-ai/cordis-plugin-group/package.json"
          PNPM="$BUNDLE/node_modules/pnpm/bin/pnpm.cjs"
          EXE="$APP/Contents/MacOS/Pavan Workflow"

          test -f "$DSH"
          test -f "$GROUP"
          test -f "$PNPM"
          test -f "$BUNDLE/.dsh/skills/pavan-workflow/SKILL.md"
          find "$APP/Contents/Resources" -name '*.icns' -print -quit | grep -q .

          codesign --verify --deep --strict "$APP"
          codesign -dv --verbose=2 "$APP" 2>&1 | grep -q 'Signature=adhoc'
          ELECTRON_RUN_AS_NODE=1 "$EXE" "$DSH" --version
          test "$(ELECTRON_RUN_AS_NODE=1 "$EXE" "$PNPM" --version)" = "11.7.0"

          ELECTRON_RUN_AS_NODE=1 "$EXE" -e \
            'require(process.argv[1]).installWorkflow(process.argv[2], process.argv[3])' \
            "$BUNDLE/desktop/workflow.cjs" "$BUNDLE" "$WORKSPACE"
          test -f "$WORKSPACE/.dsh/pavan-workflow-desktop.json"
          test -f "$WORKSPACE/.dsh/roles.yaml"
          test -f "$WORKSPACE/.dsh/skills/pavan-workflow/SKILL.md"
          test -f "$WORKSPACE/AI_Workflow_Kit/docs/STEPS.md"

          pushd "$WORKSPACE" >/dev/null
          DSH_HOME="$ISOLATED/home" ELECTRON_RUN_AS_NODE=1 "$EXE" "$DSH" web --port 0 --no-open >"$LOG" 2>&1 &
          PID=$!
          popd >/dev/null

          ready=0
          for _ in $(seq 1 90); do
            if grep -q 'dsh web:' "$LOG"; then ready=1; break; fi
            if ! kill -0 "$PID" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat "$LOG"
            exit 1
          fi

          READY_URL="$(grep -Eo 'http://127\.0\.0\.1:[0-9]+/\?token=[A-Za-z0-9_-]+' "$LOG" | tail -1)"
          test -n "$READY_URL"
          ORIGIN="$(node -e 'process.stdout.write(new URL(process.argv[1]).origin)' "$READY_URL")"
          curl --fail --silent --show-error --location --cookie-jar "$COOKIE" --cookie "$COOKIE" "$READY_URL" --output /dev/null
          BODY="$(node -e '
            const { randomUUID } = require("node:crypto");
            process.stdout.write(JSON.stringify({
              type: "client-request",
              rpcId: "pavan-desktop-smoke-" + randomUUID(),
              method: "workspace/create",
              payload: { args: { request: { path: process.argv[1] } } },
            }));
          ' "$WORKSPACE")"
          RESPONSE="$(curl --fail --silent --show-error --cookie-jar "$COOKIE" --cookie "$COOKIE" -H 'content-type: application/json' --data "$BODY" "$ORIGIN/api/workspace/create")"
          node -e '
            const payload = JSON.parse(process.argv[1]);
            if (payload?.result?.ok !== true) {
              console.error("workspace/create failed:", JSON.stringify(payload));
              process.exit(1);
            }
            const workspace = payload.result.value?.workspace;
            if (!workspace || typeof workspace.path !== "string") {
              console.error("workspace/create returned an unexpected payload:", JSON.stringify(payload));
              process.exit(1);
            }
            console.log(`registered workspace: ${workspace.path}`);
          ' "$RESPONSE"

          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
          PID=''
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.zip

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: pavan-workflow-macos-*
          path: release-assets
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="desktop-v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Bump package.json version before publishing another desktop build." >&2
            exit 1
          fi
          gh release create "$TAG" \
            --target "$TARGET_SHA" \
            --title "Pavan Workflow Desktop ${VERSION}" \
            --prerelease \
            --notes "macOS desktop alpha. Download the DMG for Apple Silicon (arm64) or Intel (x64). This build includes the whale application icon and an isolated packaged-runtime qualification that verifies the selected project is prepared, registered in the Harness Workspace registry through its authenticated Remote API, and the bundled DeepSeek Harness starts without access to repository-level node_modules. The app is ad-hoc signed but not Developer ID signed/notarized, so macOS may require Open Anyway in System Settings -> Privacy & Security."
          gh release upload "$TAG" release-assets/*
