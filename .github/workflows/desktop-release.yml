name: Desktop Release

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.dsh/**'
      - 'AI_Workflow_Kit/**'
      - 'build/**'
      - 'package.json'
      - '.github/workflows/desktop-release.yml'
  workflow_dispatch:

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Intel
            runner: macos-15-intel
            arch: --x64
            artifact: pavan-workflow-macos-x64
          - name: macOS Apple Silicon
            runner: macos-15
            arch: --arm64
            artifact: pavan-workflow-macos-arm64
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Test
        run: npm test
      - name: Syntax check desktop shell
        run: npm run desktop:check
      - name: Build ad-hoc signed DMG and ZIP
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run desktop:dist:mac -- ${{ matrix.arch }}
      - name: Smoke-test packaged app outside the repository
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APP="$(find dist -type d -name 'Pavan Workflow.app' -print -quit)"
          test -n "$SOURCE_APP"
          ISOLATED="$(mktemp -d)"
          APP="$ISOLATED/Pavan Workflow.app"
          WORKSPACE="$ISOLATED/workspace"
          LOG="$ISOLATED/harness.log"
          COOKIE="$ISOLATED/browser-cookie.txt"
          PID=''
          cleanup() { if [ -n "${PID:-}" ]; then kill "$PID" 2>/dev/null || true; fi; rm -rf "$ISOLATED"; }
          trap cleanup EXIT
          ditto "$SOURCE_APP" "$APP"
          mkdir -p "$WORKSPACE"

          BUNDLE="$APP/Contents/Resources/app"
          NODE="$APP/Contents/Resources/runtime/node"
          DSH_ROOT="$APP/Contents/Resources/dsh"
          DSH="$DSH_ROOT/node_modules/@deepseek-ai/dsh/lib/bin.js"
          PNPM="$DSH_ROOT/node_modules/pnpm/bin/pnpm.cjs"

          test -x "$NODE"
          test -f "$DSH"
          test -f "$PNPM"
          test -f "$DSH_ROOT/pavan-runtime.json"
          test -f "$BUNDLE/.dsh/skills/pavan-workflow/SKILL.md"
          find "$APP/Contents/Resources" -name '*.icns' -print -quit | grep -q .
          "$NODE" "$BUNDLE/desktop/prepare-dsh-runtime.cjs" --verify "$DSH_ROOT"
          codesign --verify --deep --strict "$APP"
          codesign -dv --verbose=2 "$APP" 2>&1 | grep -q 'Signature=adhoc'
          "$NODE" --version | grep -q '^v24\.'
          "$NODE" "$DSH" --version
          test "$("$NODE" "$PNPM" --version)" = "11.7.0"

          "$NODE" -e 'require(process.argv[1]).installWorkflow(process.argv[2], process.argv[3])' "$BUNDLE/desktop/workflow.cjs" "$BUNDLE" "$WORKSPACE"
          test -f "$WORKSPACE/.dsh/pavan-workflow-desktop.json"
          test -f "$WORKSPACE/.dsh/roles.yaml"
          test -f "$WORKSPACE/.dsh/skills/pavan-workflow/SKILL.md"
          test -f "$WORKSPACE/AI_Workflow_Kit/docs/STEPS.md"

          pushd "$WORKSPACE" >/dev/null
          DSH_HOME="$ISOLATED/home" "$NODE" "$DSH" web --port 0 --no-open >"$LOG" 2>&1 &
          PID=$!
          popd >/dev/null
          ready=0
          for _ in $(seq 1 120); do
            if grep -q 'dsh web:' "$LOG"; then ready=1; break; fi
            if ! kill -0 "$PID" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat "$LOG"; exit 1; fi

          READY_URL="$(grep -Eo 'http://127\.0\.0\.1:[0-9]+/\?token=[A-Za-z0-9_-]+' "$LOG" | tail -1)"
          test -n "$READY_URL"
          ORIGIN="$("$NODE" -e 'process.stdout.write(new URL(process.argv[1]).origin)' "$READY_URL")"
          curl --fail --silent --show-error --location --cookie-jar "$COOKIE" --cookie "$COOKIE" "$READY_URL" --output /dev/null
          BODY="$("$NODE" -e 'const{randomUUID}=require("node:crypto");process.stdout.write(JSON.stringify({type:"client-request",rpcId:"pavan-release-"+randomUUID(),method:"workspace/create",payload:{args:{request:{path:process.argv[1]}}}}))' "$WORKSPACE")"
          RESPONSE="$(curl --fail --silent --show-error --cookie-jar "$COOKIE" --cookie "$COOKIE" -H 'content-type: application/json' --data "$BODY" "$ORIGIN/api/workspace/create")"
          "$NODE" -e 'const p=JSON.parse(process.argv[1]);if(p?.result?.ok!==true||typeof p.result.value?.workspace?.path!=="string"){console.error(JSON.stringify(p));process.exit(1)}' "$RESPONSE"
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
          PID=''
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.zip

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: pavan-workflow-macos-*
          path: release-assets
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="desktop-v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "Release $TAG already exists; bump version." >&2; exit 1; fi
          gh release create "$TAG" --target "$TARGET_SHA" --title "Pavan Workflow Desktop ${VERSION}" --prerelease --notes "macOS desktop alpha. Bundles a regular Node 24 runtime and a separately prepared DeepSeek Harness production runtime whose first-party dependency/peerDependency closure is verified before packaging. The isolated packaged-app gate also installs Pavan Workflow into a fresh project, starts Harness, and registers the selected project through workspace/create before release."
          gh release upload "$TAG" release-assets/*
