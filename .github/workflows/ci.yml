name: CI

on:
  push:
  pull_request:

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Node self-tests
        run: npm test
      - name: Installer syntax
        run: bash -n install.sh
      - name: Python syntax
        run: python3 -m py_compile AI_Workflow_Kit/script/workflow_gates.py AI_Workflow_Kit/script/workflow_security_scope.py
