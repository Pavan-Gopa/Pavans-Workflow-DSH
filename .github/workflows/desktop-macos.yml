name: Desktop macOS alpha

on:
  push:
    branches: [desktop-macos, 'fix/desktop-runtime-e2e']
    paths:
      - 'desktop/**'
      - '.dsh/**'
      - 'AI_Workflow_Kit/**'
      - 'package.json'
      - '.github/workflows/desktop-macos.yml'
      - '.github/workflows/desktop-release.yml'
  workflow_dispatch:

concurrency:
  group: desktop-macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DSH_UPSTREAM_REF: c291e7961a515f6d7af9304e7fd1d257929aef26
  DSH_RUNTIME_PNPM_VERSION: 10.27.0

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Intel
            runner: macos-15-intel
            arch: --x64
            dsh_target: mac-x64
            artifact: pavan-workflow-macos-x64
          - name: macOS Apple Silicon
            runner: macos-15
            arch: --arm64
            dsh_target: mac-arm64
            artifact: pavan-workflow-macos-arm64
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout Pavan Workflow
        uses: actions/checkout@v4
      - name: Checkout pinned DeepSeek Harness
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ env.DSH_UPSTREAM_REF }}
          path: upstream-deepseek-harness
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          pnpm --version
      - name: Install upstream Harness workspace
        working-directory: upstream-deepseek-harness
        run: pnpm install --frozen-lockfile
      - name: Adapt upstream runtime preparation for ad-hoc alpha
        shell: bash
        run: |
          set -euo pipefail
          FILE="upstream-deepseek-harness/apps/desktop/scripts/prepare-dsh.ts"
          node - "$FILE" <<'NODE'
          const fs = require('node:fs')
          const file = process.argv[2]
          let body = fs.readFileSync(file, 'utf8')

          const signingBefore = "if (process.platform === 'darwin') {\n  const machoFiles = ["
          const signingAfter = "if (false && process.platform === 'darwin') {\n  const machoFiles = ["
          const signingMatches = body.split(signingBefore).length - 1
          if (signingMatches !== 1) {
            throw new Error(`Expected exactly one upstream macOS signing block, found ${signingMatches}`)
          }
          body = body.replace(signingBefore, signingAfter)

          const frozenBefore = "  '--frozen-lockfile',"
          const frozenAfter = "  '--no-frozen-lockfile',"
          const frozenMatches = body.split(frozenBefore).length - 1
          if (frozenMatches !== 1) {
            throw new Error(`Expected exactly one generated-runtime frozen lockfile flag, found ${frozenMatches}`)
          }
          body = body.replace(frozenBefore, frozenAfter)

          fs.writeFileSync(file, body)
          console.log('Patched upstream alpha runtime preparation: ad-hoc signing + generated lockfile refresh.')
          NODE
      - name: Prepare complete upstream Desktop runtime closure
        working-directory: upstream-deepseek-harness
        run: pnpm --filter @deepseek-ai/dsh-desktop run prepare:package -- ${{ matrix.dsh_target }}
      - name: Stage official Harness runtime for Pavan Workflow
        shell: bash
        run: |
          set -euo pipefail
          ROOT="upstream-deepseek-harness/apps/desktop/.desktop-build/targets/${{ matrix.dsh_target }}"
          test -x "$ROOT/runtime/node/node"
          test -f "$ROOT/runtime/pnpm/bin/pnpm.mjs"
          test -f "$ROOT/dsh/node_modules/@deepseek-ai/dsh/lib/bin.js"
          rm -rf .desktop-runtime
          mkdir -p .desktop-runtime
          cp -R "$ROOT/dsh" .desktop-runtime/dsh
          cp -R "$ROOT/runtime" .desktop-runtime/runtime
      - name: Install Pavan Workflow desktop dependencies
        run: npm install
      - name: Test workflow and desktop shell
        run: npm test
      - name: Syntax check desktop shell
        run: npm run desktop:check
      - name: Build ad-hoc signed DMG and ZIP
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run desktop:dist:mac -- ${{ matrix.arch }}
      - name: Smoke-test packaged Harness runtime in isolation
        shell: bash
        run: |
          set -euo pipefail
          BUILT_APP="$(find dist -type d -name 'Pavan Workflow.app' -print -quit)"
          test -n "$BUILT_APP"

          TMP="$(mktemp -d)"
          APP="$TMP/Pavan Workflow.app"
          cp -R "$BUILT_APP" "$APP"
          WORKSPACE="$TMP/workspace"
          mkdir -p "$WORKSPACE"

          NODE="$APP/Contents/Resources/runtime/node/node"
          DSH="$APP/Contents/Resources/dsh-runtime/node_modules/@deepseek-ai/dsh/lib/bin.js"
          PNPM="$APP/Contents/Resources/runtime/pnpm/bin/pnpm.mjs"
          test -x "$NODE"
          test -f "$DSH"
          test -f "$PNPM"
          test -f "$APP/Contents/Resources/app/.dsh/skills/pavan-workflow/SKILL.md"
          codesign --verify --deep --strict "$APP"
          codesign -dv --verbose=2 "$APP" 2>&1 | grep -q 'Signature=adhoc'

          (cd "$WORKSPACE" && env -u NODE_PATH "$NODE" "$DSH" --version)
          test "$(cd "$WORKSPACE" && env -u NODE_PATH "$NODE" "$PNPM" --version)" = "$DSH_RUNTIME_PNPM_VERSION"

          LOG="$TMP/harness.log"
          (cd "$WORKSPACE" && env -u NODE_PATH DSH_HOME="$TMP/home" DSH_TELEMETRY_DISABLED=1 "$NODE" "$DSH" web --port 0 --no-open >"$LOG" 2>&1) &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true; rm -rf "$TMP"' EXIT
          ready=0
          for _ in $(seq 1 120); do
            if grep -q 'dsh web:' "$LOG"; then ready=1; break; fi
            if ! kill -0 "$PID" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat "$LOG"
            exit 1
          fi
          URL="$(sed -nE 's/.*dsh web:[[:space:]]+(http:\/\/127\.0\.0\.1:[0-9]+[^[:space:]]*).*/\1/p' "$LOG" | tail -1)"
          test -n "$URL"
          curl --fail --silent --show-error --max-time 10 "$URL" >/dev/null
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
          cat "$LOG"
      - name: Upload desktop package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.zip
